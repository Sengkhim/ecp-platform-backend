# ════════════════════════════════════════════════════════════════════════
# ServiceAccount
# ════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecp-payment
  namespace: ecp-prod
  labels:
    app: ecp-payment

---
# ════════════════════════════════════════════════════════════════════════
# Service
# ════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: ecp-payment
  namespace: ecp-prod
  labels:
    app: ecp-payment
    environment: production
spec:
  type: ClusterIP
  selector:
    app: ecp-payment
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  sessionAffinity: None

---
# ════════════════════════════════════════════════════════════════════════
# Deployment
# ════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecp-payment
  namespace: ecp-prod
  labels:
    app: ecp-payment
    environment: production

spec:
  replicas: 2
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: ecp-payment

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: ecp-payment
        environment: production

    spec:
      serviceAccountName: ecp-payment
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: ecp-payment

      # ── Wait for Kafka ─────────────────────────────────────────────────
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z kafka.ecp-prod.svc.cluster.local 9092; do
                echo "Waiting for Kafka..."
                sleep 3
              done
              echo "Kafka is ready!"
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      containers:
        - name: ecp-payment
          image: devkhim/ecp.payment:prod.1.0.0
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: DOTNET_GCConserveMemory
              value: "5"

            # ── Kafka ──────────────────────────────────────────────────────
            - name: Kafka__BootstrapServers
              value: "kafka.ecp-prod.svc.cluster.local:9092"

            # ── Inter-service calls ────────────────────────────────────────
            - name: Services__OrderUrl
              value: "http://ecp-order.ecp-prod.svc.cluster.local"
            - name: Services__WarehouseUrl
              value: "http://ecp-warehouse.ecp-prod.svc.cluster.local"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

          # 30 × 5s = 150s max startup time
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-logs
              mountPath: /app/logs

      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-logs
          emptyDir: {}

      restartPolicy: Always

---
# ════════════════════════════════════════════════════════════════════════
# Horizontal Pod Autoscaler
# ════════════════════════════════════════════════════════════════════════
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecp-payment-hpa
  namespace: ecp-prod
  labels:
    app: ecp-payment

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ecp-payment

  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

---
# ════════════════════════════════════════════════════════════════════════
# Pod Disruption Budget
# ════════════════════════════════════════════════════════════════════════
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ecp-payment-pdb
  namespace: ecp-prod
  labels:
    app: ecp-payment

spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ecp-payment

---
# ════════════════════════════════════════════════════════════════════════
# Ingress — YARP route discovery via proxy.gateway annotations
# ════════════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecp-payment-ingress
  namespace: ecp-prod
  labels:
    app: ecp-payment
    environment: production
  annotations:
    # ── YARP gateway discovery ─────────────────────────────────────────
    proxy.gateway/enabled:         "true"
    proxy.gateway/route-path:      "/api/payment/{**catch-all}"
    proxy.gateway/destination-url: "http://ecp-payment.ecp-prod.svc.cluster.local:80"
    proxy.gateway/strip-prefix:    "true"
    proxy.gateway/health-path:     "/health"

    # ── CORS ───────────────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/enable-cors:         "true"
    nginx.ingress.kubernetes.io/cors-allow-origin:   "*"
    nginx.ingress.kubernetes.io/cors-allow-methods:  "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers:  "DNT,X-CustomHeader,Keep-Alive,User-Agent,Authorization,Content-Type,X-Correlation-ID"

    # ── Timeouts & body size ───────────────────────────────────────────
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout:    "120"
    nginx.ingress.kubernetes.io/proxy-read-timeout:    "120"
    nginx.ingress.kubernetes.io/proxy-body-size:       "10m"

spec:
  rules:
    - host: api.notcode.uk
      http:
        paths:
          - path: /api/payment
            pathType: Prefix
            backend:
              service:
                name: ecp-payment
                port:
                  number: 80