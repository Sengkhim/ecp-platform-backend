---
# ══════════════════════════════════════════════════════════════════════════════
# ECP PAYMENT SERVICE
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecp-payment
  namespace: ecp-dev
  labels:
    app: ecp-payment
    app.kubernetes.io/name: ecp-payment
    version: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecp-payment
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ecp-payment
        app.kubernetes.io/name: ecp-payment
        version: dev
    spec:
      # ── Wait for Kafka before starting ───────────────────────────────────────
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka.ecp-dev.svc.cluster.local 9092; do
                echo "Waiting for Kafka..."
                sleep 3
              done
              echo "Kafka is ready!"

      containers:
        - name: ecp-payment
          image: paymentservice:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"

            # ── Kafka — overrides localhost in Program.cs ─────────────────────
            - name: Kafka__BootstrapServers
              value: "kafka.ecp-dev.svc.cluster.local:9092"

            # ── Inter-service calls via ClusterDNS ───────────────────────────
            - name: Services__OrderUrl
              value: "http://ecp-order.ecp-dev.svc.cluster.local"
            - name: Services__WarehouseUrl
              value: "http://ecp-warehouse.ecp-dev.svc.cluster.local"

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

      restartPolicy: Always

---
# ══════════════════════════════════════════════════════════════════════════════
# Service (ClusterIP)
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: ecp-payment
  namespace: ecp-dev
  labels:
    app: ecp-payment
    app.kubernetes.io/name: ecp-payment
spec:
  type: ClusterIP
  selector:
    app: ecp-payment
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  sessionAffinity: None

---
# ══════════════════════════════════════════════════════════════════════════════
# Ingress — Gateway (YARP) auto-discovers via annotations
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecp-payment
  namespace: ecp-dev
  labels:
    app: ecp-payment
    app.kubernetes.io/name: ecp-payment
  annotations:
    # ══════════════════════════════════════════════════════════════════════════
    # REQUIRED: Gateway discovery annotations
    # These tell the KubernetesServiceDiscoveryProvider to create a route
    # ══════════════════════════════════════════════════════════════════════════
    proxy.gateway/enabled: "true"
    proxy.gateway/route-path: "/api/payment/{**catch-all}"
    
    # ══════════════════════════════════════════════════════════════════════════
    # OPTIONAL: Strip the /api/payment prefix before forwarding
    # With this enabled:
    #   Gateway receives: /api/payment/process
    #   Payment service receives: /process
    # ══════════════════════════════════════════════════════════════════════════
    proxy.gateway/strip-prefix: "true"
    
    # ══════════════════════════════════════════════════════════════════════════
    # OPTIONAL: Override destination URL
    # If not set, uses the fallback from Kubernetes:IngressBaseUrl config
    # ══════════════════════════════════════════════════════════════════════════
    proxy.gateway/destination-url: "http://ecp-payment.ecp-dev.svc.cluster.local"
    
    # ══════════════════════════════════════════════════════════════════════════
    # OPTIONAL: Health check path for active health monitoring
    # ══════════════════════════════════════════════════════════════════════════
    proxy.gateway/health-path: "/health"
    
    # ══════════════════════════════════════════════════════════════════════════
    # nginx ingress controller annotations
    # ══════════════════════════════════════════════════════════════════════════
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,Authorization,Content-Type,X-Correlation-ID"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

spec:
  ingressClassName: nginx
  rules:
    - host: api-gateway.dev
      http:
        paths:
          - path: /api/payment(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ecp-payment
                port:
                  number: 80