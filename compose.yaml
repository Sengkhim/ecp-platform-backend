  ecp.apigateway:
    image: api-gateway:local
    container_name: api-gateway
    ports:
      - "5028:8080"
    
    environment:
      ASPNETCORE_ENVIRONMENT:      Development
      ASPNETCORE_URLS:             http://+:8080
      Kubernetes__Namespace:       weather-api
      Kubernetes__IngressBaseUrl:  http://analystservice-local
      Gateway__EnableRateLimiting: "false"
      
      KUBECONFIG:              /home/app/.kube/config
      MINIKUBE_HOST_PATH:      /Users/${USER}
      MINIKUBE_CONTAINER_PATH: /home/app
      
      # Auto-resolved from minikube at compose time.
      # Run: source .env  OR  docker compose up (reads .env automatically)
      K8S_API_SERVER: ${K8S_API_SERVER}
    
    build:
      context:    .
      dockerfile: ECP.ApiGateway/Dockerfile
    
    volumes:
      - type:      bind
        source:    ${HOME}/.kube
        target:    /home/app/.kube
        read_only: true
      - type:      bind
        source:    ${HOME}/.minikube
        target:    /home/app/.minikube
        read_only: true
    
    extra_hosts:
      - "analystservice.local:host-gateway"
      - "host.minikube.internal:host-gateway"
    
    restart: unless-stopped
    
    healthcheck:
      test:     ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 15s
      timeout:  5s
      retries:  3
    
