# ════════════════════════════════════════════════════════════════════════
# ConfigMap — Redis configuration
# ════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: ecp-prod
  labels:
    app: redis
data:
  redis.conf: |
    # Persistence
    appendonly yes
    appendfsync everysec

    # Memory management
    maxmemory 256mb
    maxmemory-policy allkeys-lru

    # Connection
    tcp-keepalive 300
    timeout 0

    # Disable protected mode for cluster internal access
    protected-mode no

---
# ════════════════════════════════════════════════════════════════════════
# PersistentVolumeClaim — Redis data storage
# ════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: ecp-prod
  labels:
    app: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
# ════════════════════════════════════════════════════════════════════════
# Service
# ════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ecp-prod
  labels:
    app: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP

---
# ════════════════════════════════════════════════════════════════════════
# Deployment
# ════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ecp-prod
  labels:
    app: redis

spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis

  strategy:
    type: Recreate   # Single instance — Recreate avoids data corruption

  template:
    metadata:
      labels:
        app: redis

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent

          command:
            - redis-server
            - /etc/redis/redis.conf

          ports:
            - containerPort: 6379
              name: redis

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config
              mountPath: /etc/redis
              readOnly: true

      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
        - name: redis-config
          configMap:
            name: redis-config

---
# ════════════════════════════════════════════════════════════════════════
# Pod Disruption Budget
# ════════════════════════════════════════════════════════════════════════
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: ecp-prod
  labels:
    app: redis
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: redis