apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecp-product-service
  namespace: ecp-dev
  labels:
    app: ecp-product-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecp-product-service
  template:
    metadata:
      labels:
        app: ecp-product-service
    spec:
      containers:
        - name: ecp-product-service
          image: ecp-product-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: MongoDB__ConnectionString
              value: "mongodb://root:pass168@mongodb.ecp-dev.svc.cluster.local:27017"
            - name: MongoDB__Database
              value: "product_service"
            - name: Redis__ConnectionString
              value: "redis.ecp-dev.svc.cluster.local:6379"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ecp-product-service
  namespace: ecp-dev
spec:
  selector:
    app: ecp-product-service
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecp-product-service
  namespace: ecp-dev
  annotations:
    proxy.gateway/enabled: "true"
    proxy.gateway/route-path: "/api/product/{**catch-all}"
    proxy.gateway/strip-prefix: "true"
    proxy.gateway/health-path: "/health"
    proxy.gateway/destination-url: "http://ecp-product-service.ecp-dev.svc.cluster.local"
spec:
  rules:
    - http:
        paths:
          - path: /api/product
            pathType: Prefix
            backend:
              service:
                name: ecp-product-service
                port:
                  number: 80
