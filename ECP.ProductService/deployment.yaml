# =========================================
# PostgreSQL Secret
# =========================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: ecp-dev
type: Opaque
stringData:
  connection-string: "Host=postgres;Port=5432;Database=OrderDb;Username=postgres;Password=postgres"

---
# =========================================
# PostgreSQL Deployment
# =========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ecp-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: OrderDb

---
# =========================================
# PostgreSQL Service
# =========================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ecp-dev
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
# =========================================
# Redis Secret (FIXED)
# =========================================
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: ecp-dev
type: Opaque
stringData:
  redis-password: "redis123"
  redis-connection: "redis:6379,password=redis123,abortConnect=false"

---
# =========================================
# Redis Deployment (FIXED)
# =========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ecp-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379

          # ✅ IMPORTANT FIX (env expansion works)
          command: ["sh", "-c"]
          args:
            - redis-server --requirepass "$REDIS_PASSWORD"

          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secrets
                  key: redis-password

---
# =========================================
# Redis Service
# =========================================
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ecp-dev
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
# =========================================
# Product Service Deployment
# =========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecp-product-service
  namespace: ecp-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecp-product-service
  template:
    metadata:
      labels:
        app: ecp-product-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh","-c","until nc -z postgres 5432; do echo waiting for postgres; sleep 3; done"]

        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh","-c","until nc -z redis 6379; do echo waiting for redis; sleep 3; done"]

      containers:
        - name: ecp-product-service
          image: ecp-product-service:dev
          ports:
            - containerPort: 8080

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production

            # ✅ PostgreSQL
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: connection-string

            # ✅ Redis (FIXED)
            - name: Redis__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: redis-secrets
                  key: redis-connection

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15

---
# =========================================
# Product Service
# =========================================
apiVersion: v1
kind: Service
metadata:
  name: ecp-product-service
  namespace: ecp-dev
spec:
  selector:
    app: ecp-product-service
  ports:
    - port: 80
      targetPort: 8080

---
# =========================================
# Ingress
# =========================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecp-product-service
  namespace: ecp-dev
spec:
  rules:
    - http:
        paths:
          - path: /api/product
            pathType: Prefix
            backend:
              service:
                name: ecp-product-service
                port:
                  number: 80