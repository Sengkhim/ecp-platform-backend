---
# ══════════════════════════════════════════════════════════════════════════════
# ECP PRODUCT SERVICE
# Uses MongoDB for data storage and Redis for caching
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecp-product-service
  namespace: ecp-dev
  labels:
    app: ecp-product-service
    app.kubernetes.io/name: ecp-product-service
    version: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecp-product-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ecp-product-service
        app.kubernetes.io/name: ecp-product-service
        version: dev
    spec:
      # ── Wait for both MongoDB and Redis to be reachable before starting ────
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MongoDB..."
              until nc -z mongodb.ecp-dev.svc.cluster.local 27017; do
                echo "MongoDB not ready, retrying in 3s..."
                sleep 3
              done
              echo "MongoDB is ready."

        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Redis..."
              until nc -z redis.ecp-dev.svc.cluster.local 6379; do
                echo "Redis not ready, retrying in 3s..."
                sleep 3
              done
              echo "Redis is ready."

      containers:
        - name: ecp-product-service
          image: productservice:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"

            # ── MongoDB ──────────────────────────────────────────────────────
            - name: MongoDB__ConnectionString
              value: "mongodb://root:pass168@mongodb.ecp-dev.svc.cluster.local:27017"
            - name: MongoDB__Database
              value: "product_service"

            # ── Redis (no password required) ─────────────────────────────────
            - name: Redis__ConnectionString
              value: "redis.ecp-dev.svc.cluster.local:6379"

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      restartPolicy: Always

---
# ══════════════════════════════════════════════════════════════════════════════
# Product Service (ClusterIP)
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: ecp-product-service
  namespace: ecp-dev
  labels:
    app: ecp-product-service
    app.kubernetes.io/name: ecp-product-service
spec:
  type: ClusterIP
  selector:
    app: ecp-product-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  sessionAffinity: None

---
# ══════════════════════════════════════════════════════════════════════════════
# Ingress — Gateway (YARP) auto-discovers via annotations
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecp-product-service
  namespace: ecp-dev
  labels:
    app: ecp-product-service
    app.kubernetes.io/name: ecp-product-service
  annotations:
    # ══════════════════════════════════════════════════════════════════════════
    # REQUIRED: Gateway discovery annotations
    # ══════════════════════════════════════════════════════════════════════════
    proxy.gateway/enabled: "true"
    proxy.gateway/route-path: "/api/product/{**catch-all}"
    
    # ══════════════════════════════════════════════════════════════════════════
    # OPTIONAL: Strip the /api/product prefix before forwarding
    # ══════════════════════════════════════════════════════════════════════════
    proxy.gateway/strip-prefix: "true"
    
    # ══════════════════════════════════════════════════════════════════════════
    # OPTIONAL: Override destination URL
    # ══════════════════════════════════════════════════════════════════════════
    proxy.gateway/destination-url: "http://ecp-product-service.ecp-dev.svc.cluster.local"
    
    # ══════════════════════════════════════════════════════════════════════════
    # OPTIONAL: Health check path
    # ══════════════════════════════════════════════════════════════════════════
    proxy.gateway/health-path: "/health"

spec:
  ingressClassName: nginx
  rules:
    - host: api-gateway.dev
      http:
        paths:
          - path: /api/product(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ecp-product-service
                port:
                  number: 80