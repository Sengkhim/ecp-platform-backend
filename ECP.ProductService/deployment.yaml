# ════════════════════════════════════════════════════════════════════════
# Secret — MongoDB + Redis credentials
# WARNING: Do not commit real secrets to version control.
# ════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: ecp-product-secrets
  namespace: ecp-prod
  labels:
    app: ecp-product
    environment: production
type: Opaque
stringData:
  mongo-connection: "mongodb://root:pass168@mongodb.ecp-prod.svc.cluster.local:27017"
  redis-connection: "redis.ecp-prod.svc.cluster.local:6379"

---
# ════════════════════════════════════════════════════════════════════════
# ServiceAccount
# ════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecp-product
  namespace: ecp-prod
  labels:
    app: ecp-product

---
# ════════════════════════════════════════════════════════════════════════
# Service
# ════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: ecp-product
  namespace: ecp-prod
  labels:
    app: ecp-product
    environment: production

spec:
  type: ClusterIP
  selector:
    app: ecp-product
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  sessionAffinity: None

---
# ════════════════════════════════════════════════════════════════════════
# Deployment
# ════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecp-product
  namespace: ecp-prod
  labels:
    app: ecp-product
    environment: production

spec:
  replicas: 2
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: ecp-product

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: ecp-product
        environment: production

    spec:
      serviceAccountName: ecp-product
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: ecp-product

      # ── Wait for dependencies ──────────────────────────────────────────
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for MongoDB..."
              until nc -z mongodb.ecp-prod.svc.cluster.local 27017; do
                echo "MongoDB not ready, retrying in 3s..."
                sleep 3
              done
              echo "MongoDB is ready."
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

        - name: wait-for-redis
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for Redis..."
              until nc -z redis.ecp-prod.svc.cluster.local 6379; do
                echo "Redis not ready, retrying in 3s..."
                sleep 3
              done
              echo "Redis is ready."
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      containers:
        - name: ecp-product
          image: devkhim/ecp.product:prod.1.0.0
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: DOTNET_GCConserveMemory
              value: "5"

            # ── MongoDB ────────────────────────────────────────────────────
            - name: MongoDB__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: ecp-product-secrets
                  key: mongo-connection
            - name: MongoDB__Database
              value: "product_service"

            # ── Redis ──────────────────────────────────────────────────────
            - name: Redis__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: ecp-product-secrets
                  key: redis-connection

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # 30 × 5s = 150s max startup time
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-logs
              mountPath: /app/logs

      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-logs
          emptyDir: {}

      restartPolicy: Always

---
# ════════════════════════════════════════════════════════════════════════
# Horizontal Pod Autoscaler
# ════════════════════════════════════════════════════════════════════════
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecp-product-hpa
  namespace: ecp-prod
  labels:
    app: ecp-product

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ecp-product

  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

---
# ════════════════════════════════════════════════════════════════════════
# Pod Disruption Budget
# ════════════════════════════════════════════════════════════════════════
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ecp-product-pdb
  namespace: ecp-prod
  labels:
    app: ecp-product

spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ecp-product

---
# ════════════════════════════════════════════════════════════════════════
# Ingress — YARP route discovery via proxy.gateway annotations
# ════════════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecp-product-ingress
  namespace: ecp-prod
  labels:
    app: ecp-product
    environment: production
  annotations:
    # ── YARP gateway discovery ─────────────────────────────────────────
    proxy.gateway/enabled:         "true"
    proxy.gateway/route-path:      "/api/product/{**catch-all}"
    proxy.gateway/destination-url: "http://ecp-product.ecp-prod.svc.cluster.local:80"
    proxy.gateway/strip-prefix:    "true"
    proxy.gateway/health-path:     "/health/ready"

    # ── CORS ───────────────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/enable-cors:         "true"
    nginx.ingress.kubernetes.io/cors-allow-origin:   "*"
    nginx.ingress.kubernetes.io/cors-allow-methods:  "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers:  "DNT,X-CustomHeader,Keep-Alive,User-Agent,Authorization,Content-Type,X-Correlation-ID"

    # ── Timeouts & body size ───────────────────────────────────────────
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout:    "120"
    nginx.ingress.kubernetes.io/proxy-read-timeout:    "120"
    nginx.ingress.kubernetes.io/proxy-body-size:       "10m"

spec:
  rules:
    - host: api.notcode.uk
      http:
        paths:
          - path: /api/product
            pathType: Prefix
            backend:
              service:
                name: ecp-product
                port:
                  number: 80