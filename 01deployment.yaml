apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-analy-service
  namespace: ecp-dev
  labels:
    app: order-analy-service
    version: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-analy-service
  template:
    metadata:
      labels:
        app: order-analy-service
        version: dev
    spec:
      containers:
        - name: order-analy-service
          image: ecp.order_analy_serservice:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always