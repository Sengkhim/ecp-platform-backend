# ════════════════════════════════════════════════════════════════════════
# Service
# ════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: ecp-warehouse
  namespace: ecp-prod
  labels:
    app: ecp-warehouse

spec:
  type: ClusterIP

  selector:
    app: ecp-warehouse

  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

---
# ════════════════════════════════════════════════════════════════════════
# Deployment
# ════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecp-warehouse
  namespace: ecp-prod

  labels:
    app: ecp-warehouse
    environment: production

spec:
  replicas: 3

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: ecp-warehouse

  template:
    metadata:
      labels:
        app: ecp-warehouse
        environment: production

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: ecp-warehouse
          image: devkhim/epc.warehouse:v5
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              name: http

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"

            - name: ASPNETCORE_URLS
              value: "http://+:8080"

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "1000m"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080

            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health/live
              port: 8080

            failureThreshold: 30
            periodSeconds: 5

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001

      restartPolicy: Always

---
# ════════════════════════════════════════════════════════════════════════
# Horizontal Pod Autoscaler
# ════════════════════════════════════════════════════════════════════════
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecp-warehouse
  namespace: ecp-prod

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ecp-warehouse

  minReplicas: 3
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70

---
# ════════════════════════════════════════════════════════════════════════
# Pod Disruption Budget
# ════════════════════════════════════════════════════════════════════════
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ecp-warehouse
  namespace: ecp-prod

spec:
  minAvailable: 1

  selector:
    matchLabels:
      app: ecp-warehouse
