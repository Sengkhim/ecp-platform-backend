---
# ──────────────────────────────────────────────────────────────────────────────
# Namespace
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: ecp-dev
  labels:
    name: ecp-dev
    environment: development

---
# ──────────────────────────────────────────────────────────────────────────────
# Deployment
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecp-warehouse
  namespace: ecp-dev
  labels:
    app: ecp-warehouse
    version: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecp-warehouse
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ecp-warehouse
        version: dev
    spec:
      containers:
        - name: ecp-warehouse
          image: ecp-warehouse:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            # FIX: Disable HTTPS redirect — running plain HTTP inside cluster
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

      restartPolicy: Always

---
# ──────────────────────────────────────────────────────────────────────────────
# Service (ClusterIP)
# ── Used by api-gateway YARP to forward requests internally
# ── gateway calls: http://ecp-warehouse (cluster DNS) → this service → pod
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: ecp-warehouse
  namespace: ecp-dev
  labels:
    app: ecp-warehouse
spec:
  type: ClusterIP
  selector:
    app: ecp-warehouse
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  sessionAffinity: None

---
# ──────────────────────────────────────────────────────────────────────────────
# Service (NodePort) — Minikube direct access
# ── Access via: http://<minikube-ip>:30080
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: ecp-warehouse-nodeport
  namespace: ecp-dev
  labels:
    app: ecp-warehouse
spec:
  type: NodePort
  selector:
    app: ecp-warehouse
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
  sessionAffinity: None

---
# ──────────────────────────────────────────────────────────────────────────────
# Service (LoadBalancer) — MetalLB production
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: ecp-warehouse-lb
  namespace: ecp-dev
  labels:
    app: ecp-warehouse
spec:
  type: LoadBalancer
  selector:
    app: ecp-warehouse
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  sessionAffinity: None

---
# ──────────────────────────────────────────────────────────────────────────────
# Ingress
# ── Exposes warehouse externally at ecp-warehouse.dev
# ── Also read by api-gateway KubernetesServiceDiscoveryProvider:
# ──   proxy.gateway/enabled      = true   → gateway picks this up
# ──   proxy.gateway/route-path   = /api/ecp-warehouse/{**catch-all}
# ──   proxy.gateway/strip-prefix = true   → strips /api/ecp-warehouse
# ──   destination                = http://ecp-warehouse (ClusterIP DNS)
# ──
# ── FIX: route-path was "/api/epc-warehouse" (typo) → "/api/ecp-warehouse"
# ── FIX: added proxy.gateway/destination-url pointing to ClusterIP
# ──      so YARP calls ecp-warehouse directly inside cluster (no DNS loop)
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecp-warehouse-ingress
  namespace: ecp-dev
  labels:
    app: ecp-warehouse
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

    # ── CORS ──────────────────────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,Authorization,Content-Type,X-Correlation-ID"

    # ── Timeouts ──────────────────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

    # ── Max upload size ───────────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    # ── API Gateway (YARP) discovery ──────────────────────────────────────────
    # The gateway watches this ingress and builds a YARP route:
    #   /api/ecp-warehouse/{**catch-all}  →  strip prefix  →  http://ecp-warehouse
    #
    # proxy.gateway/destination-url points to ClusterIP service name (not external host)
    # This means YARP forwards directly inside the cluster — fast, no external DNS needed
    #
    # Example:
    #   curl http://api-gateway.dev/api/ecp-warehouse/
    #     → YARP strips /api/ecp-warehouse
    #     → forwards to http://ecp-warehouse/
    #     → ClusterIP routes to ecp-warehouse pod :8080
    #     → returns WeatherForecast ✅
    proxy.gateway/enabled: "true"
    proxy.gateway/route-path: "/api/ecp-warehouse/{**catch-all}"  # ✅ ecp
    proxy.gateway/strip-prefix: "true"
    proxy.gateway/destination-url: "http://ecp-warehouse.ecp-dev.svc.cluster.local"
    proxy.gateway/health-path: "/health/live"

spec:
  ingressClassName: nginx
  rules:
    # ⚠️ Add to /etc/hosts: 192.168.49.2 ecp-warehouse.dev
    - host: ecp-warehouse.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ecp-warehouse
                port:
                  number: 80