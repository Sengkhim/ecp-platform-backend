---
# ──────────────────────────────────────────────────────────────────────────────
# Namespace
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: ecp-dev
  labels:
    name: ecp-dev
    environment: development

---
# ──────────────────────────────────────────────────────────────────────────────
# Deployment
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecp-order-analyser
  namespace: ecp-dev
  labels:
    app: ecp-order-analyser
    app.kubernetes.io/name: ecp-order-analyser
    version: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecp-order-analyser
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ecp-order-analyser
        app.kubernetes.io/name: ecp-order-analyser
        version: dev
    spec:
      containers:
        - name: ecp-order-analyser
          image: ecp-order-analyser:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            # ── Call Warehouse service internally via ClusterDNS ──────────
            - name: Services__WarehouseUrl
              value: "http://ecp-warehouse.ecp-dev.svc.cluster.local"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always

---
# ──────────────────────────────────────────────────────────────────────────────
# Service (ClusterIP) — internal pod-to-pod communication
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: ecp-order-analyser
  namespace: ecp-dev
  labels:
    app: ecp-order-analyser
    app.kubernetes.io/name: ecp-order-analyser
spec:
  type: ClusterIP
  selector:
    app: ecp-order-analyser
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  sessionAffinity: None

---
# ──────────────────────────────────────────────────────────────────────────────
# Ingress
# ── Gateway (YARP) watches this and auto-builds route via annotations
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecp-order-analyser-ingress
  namespace: ecp-dev
  labels:
    app: ecp-order-analyser
    app.kubernetes.io/name: ecp-order-analyser
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

    # ── CORS ──────────────────────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,Authorization,Content-Type,X-Correlation-ID"

    # ── Timeouts ──────────────────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

    # ── Max upload size ───────────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    # ── Gateway (YARP) Discovery ──────────────────────────────────────────────
    # KubernetesServiceDiscoveryProvider watches this ingress automatically.
    # Route: /api/order-analyser/{**catch-all}
    #   → strips /api/order-analyser
    #   → forwards to http://ecp-order-analyser.ecp-dev.svc.cluster.local/{catch-all}
    proxy.gateway/enabled: "true"
    proxy.gateway/route-path: "/api/order-analyser/{**catch-all}"
    proxy.gateway/strip-prefix: "true"
    proxy.gateway/health-path: "/health/live"
    proxy.gateway/destination-url: "http://ecp-order-analyser.ecp-dev.svc.cluster.local"

spec:
  ingressClassName: nginx
  rules:
    - host: ecp-order-analyser.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ecp-order-analyser
                port:
                  number: 80