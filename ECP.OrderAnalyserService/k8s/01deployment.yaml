apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-analy-service
  namespace: ecp-dev
  labels:
    app: order-analy-service
    version: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-analy-service
  template:
    metadata:
      labels:
        app: order-analy-service
        version: dev
    spec:
      containers:
        - name: order-analy-service
          image: ecp.order_analy_serservice:dev
          imagePullPolicy: Never  # Use local image loaded into Minikube
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Startup probe - gives app time to start (up to 5 minutes)
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30  # 30 * 10s = 300s (5 minutes) to start
          # Liveness probe - restarts if app becomes unhealthy
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness probe - stops traffic if app not ready
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always