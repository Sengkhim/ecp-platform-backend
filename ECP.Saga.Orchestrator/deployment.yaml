---
# Secret - MongoDB saga connection
apiVersion: v1
kind: Secret
metadata:
  name: ecp-saga-secrets
  namespace: ecp-dev
type: Opaque
stringData:
  mongo-saga-connection: "mongodb://root:pass168@mongodb.ecp-dev.svc.cluster.local:27017/sagas?authSource=admin"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecp-saga-orchestrator
  namespace: ecp-dev
  labels:
    app: ecp-saga-orchestrator
    app.kubernetes.io/name: ecp-saga-orchestrator
    version: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecp-saga-orchestrator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ecp-saga-orchestrator
        app.kubernetes.io/name: ecp-saga-orchestrator
        version: dev
    spec:
      # Wait for Kafka + MongoDB before starting
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka.ecp-dev.svc.cluster.local 9092; do
                echo "Waiting for Kafka..."
                sleep 3
              done
              echo "Kafka is ready!"
        - name: wait-for-mongodb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mongodb.ecp-dev.svc.cluster.local 27017; do
                echo "Waiting for MongoDB..."
                sleep 3
              done
              echo "MongoDB is ready!"

      containers:
        - name: ecp-saga-orchestrator
          image: ecp-saga-orchestrator:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"

            # Kafka - overrides localhost in Program.cs
            - name: Kafka__BootstrapServers
              value: "kafka.ecp-dev.svc.cluster.local:9092"

            # MongoDB - saga state store
            # Overrides 127.0.0.1 in MongoDbRepository config
            - name: MongoDB__SagaConnection
              valueFrom:
                secretKeyRef:
                  name: ecp-saga-secrets
                  key: mongo-saga-connection

            # Downstream services via ClusterDNS
            - name: Services__OrderUrl
              value: "http://ecp-order.ecp-dev.svc.cluster.local"
            - name: Services__PaymentUrl
              value: "http://ecp-payment.ecp-dev.svc.cluster.local"
            - name: Services__WarehouseUrl
              value: "http://ecp-warehouse.ecp-dev.svc.cluster.local"
            - name: Services__NotificationUrl
              value: "http://ecp-notification.ecp-dev.svc.cluster.local"

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

      restartPolicy: Always

---
# Service (ClusterIP) - internal only, no gateway route needed
apiVersion: v1
kind: Service
metadata:
  name: ecp-saga-orchestrator
  namespace: ecp-dev
  labels:
    app: ecp-saga-orchestrator
    app.kubernetes.io/name: ecp-saga-orchestrator
spec:
  type: ClusterIP
  selector:
    app: ecp-saga-orchestrator
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  sessionAffinity: None