# ════════════════════════════════════════════════════════════════════════
# Secret — MongoDB saga connection
# WARNING: Do not commit real secrets to version control.
# ════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: ecp-saga-secrets
  namespace: ecp-prod
  labels:
    app: ecp-saga-orchestrator
    environment: production
type: Opaque
stringData:
  mongo-saga-connection: "mongodb://root:pass168@mongodb.ecp-prod.svc.cluster.local:27017/sagas?authSource=admin&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000"

---
# ════════════════════════════════════════════════════════════════════════
# ServiceAccount
# ════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecp-saga-orchestrator
  namespace: ecp-prod
  labels:
    app: ecp-saga-orchestrator

---
# ════════════════════════════════════════════════════════════════════════
# Service — internal only
# ════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: ecp-saga-orchestrator
  namespace: ecp-prod
  labels:
    app: ecp-saga-orchestrator
    environment: production
spec:
  type: ClusterIP
  selector:
    app: ecp-saga-orchestrator
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  sessionAffinity: None

---
# ════════════════════════════════════════════════════════════════════════
# Deployment
# ════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecp-saga-orchestrator
  namespace: ecp-prod
  labels:
    app: ecp-saga-orchestrator
    environment: production

spec:
  replicas: 1
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: ecp-saga-orchestrator

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: ecp-saga-orchestrator
        environment: production

    spec:
      serviceAccountName: ecp-saga-orchestrator
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60

      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z kafka.ecp-prod.svc.cluster.local 9092; do
                echo "Waiting for Kafka..."
                sleep 3
              done
              echo "Kafka is ready!"
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

        - name: wait-for-mongodb
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z mongodb.ecp-prod.svc.cluster.local 27017; do
                echo "Waiting for MongoDB..."
                sleep 3
              done
              echo "MongoDB is ready!"
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      containers:
        - name: ecp-saga-orchestrator
          image: devkhim/ecp.saga:prod.1.0.1
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: DOTNET_GCConserveMemory
              value: "7"           # aggressive GC for low-memory node

            - name: Kafka__BootstrapServers
              value: "kafka.ecp-prod.svc.cluster.local:9092"

            - name: MongoDB__SagaConnection
              valueFrom:
                secretKeyRef:
                  name: ecp-saga-secrets
                  key: mongo-saga-connection

            - name: Services__OrderUrl
              value: "http://ecp-order.ecp-prod.svc.cluster.local"
            - name: Services__PaymentUrl
              value: "http://ecp-payment.ecp-prod.svc.cluster.local"
            - name: Services__WarehouseUrl
              value: "http://ecp-warehouse.ecp-prod.svc.cluster.local"
            - name: Services__NotificationUrl
              value: "http://ecp-notification.ecp-prod.svc.cluster.local"

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"    # reduced for single-node
            limits:
              cpu: "300m"
              memory: "256Mi"

          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-logs
              mountPath: /app/logs

      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-logs
          emptyDir: {}

      restartPolicy: Always

---
# ════════════════════════════════════════════════════════════════════════
# Pod Disruption Budget
# ════════════════════════════════════════════════════════════════════════
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ecp-saga-orchestrator-pdb
  namespace: ecp-prod
  labels:
    app: ecp-saga-orchestrator

spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ecp-saga-orchestrator

---
# ════════════════════════════════════════════════════════════════════════
# Ingress — health check only
# ════════════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecp-saga-orchestrator-ingress
  namespace: ecp-prod
  labels:
    app: ecp-saga-orchestrator
    environment: production
  annotations:
    proxy.gateway/enabled:         "true"
    proxy.gateway/route-path:      "/api/saga/{**catch-all}"
    proxy.gateway/destination-url: "http://ecp-saga-orchestrator.ecp-prod.svc.cluster.local:80"
    proxy.gateway/strip-prefix:    "true"
    proxy.gateway/health-path:     "/health"
spec:
  rules:
    - host: api.notcode.uk
      http:
        paths:
          - path: /api/saga
            pathType: Prefix
            backend:
              service:
                name: ecp-saga-orchestrator
                port:
                  number: 80