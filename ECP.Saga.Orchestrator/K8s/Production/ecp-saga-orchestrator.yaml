# ════════════════════════════════════════════════════════════════════════
# Secret — MongoDB saga connection
# WARNING: Do not commit real secrets to version control.
# ════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: ecp-saga-secrets
  namespace: ecp-prod
  labels:
    app: ecp-saga-orchestrator
    environment: production
type: Opaque
stringData:
  mongo-saga-connection: "mongodb://root:pass168@mongodb.ecp-prod.svc.cluster.local:27017/sagas?authSource=admin&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000"

---
# ════════════════════════════════════════════════════════════════════════
# ServiceAccount
# ════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecp-saga-orchestrator
  namespace: ecp-prod
  labels:
    app: ecp-saga-orchestrator

---
# ════════════════════════════════════════════════════════════════════════
# Service — internal only, no gateway route needed
# ════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: ecp-saga-orchestrator
  namespace: ecp-prod
  labels:
    app: ecp-saga-orchestrator
    environment: production
spec:
  type: ClusterIP
  selector:
    app: ecp-saga-orchestrator
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  sessionAffinity: None

---
# ════════════════════════════════════════════════════════════════════════
# Deployment
# ════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecp-saga-orchestrator
  namespace: ecp-prod
  labels:
    app: ecp-saga-orchestrator
    environment: production

spec:
  # !! IMPORTANT: Keep replicas at 1 for saga orchestrator
  # Multiple replicas would cause race conditions on saga state in MongoDB.
  # MassTransit handles concurrency via MongoDbConcurrencyException retries
  # but a single instance is safer and simpler for production.
  replicas: 1
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: ecp-saga-orchestrator

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: ecp-saga-orchestrator
        environment: production

    spec:
      serviceAccountName: ecp-saga-orchestrator
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: ecp-saga-orchestrator

      # ── Wait for Kafka + MongoDB ───────────────────────────────────────
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z kafka.ecp-prod.svc.cluster.local 9092; do
                echo "Waiting for Kafka..."
                sleep 3
              done
              echo "Kafka is ready!"
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

        - name: wait-for-mongodb
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z mongodb.ecp-prod.svc.cluster.local 27017; do
                echo "Waiting for MongoDB..."
                sleep 3
              done
              echo "MongoDB is ready!"
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      containers:
        - name: ecp-saga-orchestrator
          image: devkhim/ecp.saga:prod.1.0.0
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: DOTNET_GCConserveMemory
              value: "5"

            # ── Kafka ──────────────────────────────────────────────────────
            - name: Kafka__BootstrapServers
              value: "kafka.ecp-prod.svc.cluster.local:9092"

            # ── MongoDB saga state store ───────────────────────────────────
            - name: MongoDB__SagaConnection
              valueFrom:
                secretKeyRef:
                  name: ecp-saga-secrets
                  key: mongo-saga-connection

            # ── Downstream services ────────────────────────────────────────
            - name: Services__OrderUrl
              value: "http://ecp-order.ecp-prod.svc.cluster.local"
            - name: Services__PaymentUrl
              value: "http://ecp-payment.ecp-prod.svc.cluster.local"
            - name: Services__WarehouseUrl
              value: "http://ecp-warehouse.ecp-prod.svc.cluster.local"
            - name: Services__NotificationUrl
              value: "http://ecp-notification.ecp-prod.svc.cluster.local"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

          # 30 × 5s = 150s max startup time
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                # Allow in-flight saga transitions to complete before shutdown
                command: ["/bin/sh", "-c", "sleep 15"]

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-logs
              mountPath: /app/logs

      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-logs
          emptyDir: {}

      restartPolicy: Always

---
# ════════════════════════════════════════════════════════════════════════
# Pod Disruption Budget
# ════════════════════════════════════════════════════════════════════════
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ecp-saga-orchestrator-pdb
  namespace: ecp-prod
  labels:
    app: ecp-saga-orchestrator

spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ecp-saga-orchestrator