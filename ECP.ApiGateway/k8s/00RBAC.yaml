apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: weather-api
  labels:
    app.kubernetes.io/name: api-gateway

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: api-gateway-ingress-reader
  labels:
    app.kubernetes.io/name: api-gateway
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get","list","watch"]
    
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-gateway-ingress-reader
  labels:
    app.kubernetes.io/name: api-gateway
subjects:
  - kind: ServiceAccount
    name: api-gateway
    namespace: weather-api
roleRef:
  kind: ClusterRole
  name: api-gateway-ingress-reader
  apiGroup: rbac.authorization.k8s.io