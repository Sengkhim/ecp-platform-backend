# ════════════════════════════════════════════════════════════════════════
# Secret
# ════════════════════════════════════════════════════════════════════════
# WARNING: Do not commit this file to version control with real secrets.
# Use a secrets manager or Kubernetes Secrets Tool instead.
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: ecp-prod
type: Opaque
stringData:
  JWT_SECRET: "PyMK2JEBuRWxzcUJ28kxNYHyR0IQqUvlR7Ol8RTztK54VTjZJNYmcWqjLQryXdJGPaGzHvn1kVI+siZhT6sTWQ=="

---
# ════════════════════════════════════════════════════════════════════════
# Deployment
# ════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecp-prod
  labels:
    app: api-gateway
    environment: production

spec:
  replicas: 3
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: api-gateway

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: api-gateway
        environment: production

    spec:
      terminationGracePeriodSeconds: 30

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: api-gateway

      containers:
        - name: api-gateway
          image: devkhim/ecp.apigateway:prod.1.0.0
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              name: http

          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secret
                  key: JWT_SECRET

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

---
# ════════════════════════════════════════════════════════════════════════
# Service
# ════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecp-prod
  labels:
    app: api-gateway

spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

---
# ════════════════════════════════════════════════════════════════════════
# Horizontal Pod Autoscaler
# ════════════════════════════════════════════════════════════════════════
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: ecp-prod

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway

  minReplicas: 3
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
# ════════════════════════════════════════════════════════════════════════
# Pod Disruption Budget
# ════════════════════════════════════════════════════════════════════════
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: ecp-prod

spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway