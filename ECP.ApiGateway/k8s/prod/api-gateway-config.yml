apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: ecp-prod
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft.AspNetCore": "Warning",
          "Yarp": "Information",
          "ECP.ApiGateway": "Information"
        }
      },

      "AllowedHosts": "*",

      "Kubernetes": {
        "Namespace": "ecp-prod",
        "IngressBaseUrl": "http://ecp-warehouse.ecp-prod.svc.cluster.local"
      },

      "Gateway": {
        "EnableRateLimiting": true,
        "DefaultRateLimitPermitLimit": 100,
        "DefaultRateLimitWindowSeconds": 10
      },

      "HealthChecks": {
        "Enable": true,
        "Path": "/health"
      },

      "Cors": {
        "Enable": true,
        "AllowedOrigins": [
          "https://app.epc.com"
        ],
        "AllowedMethods": [
          "GET",
          "POST",
          "PUT",
          "DELETE",
          "OPTIONS"
        ],
        "AllowedHeaders": [
          "Authorization",
          "Content-Type",
          "X-Correlation-ID"
        ]
      }
    }
