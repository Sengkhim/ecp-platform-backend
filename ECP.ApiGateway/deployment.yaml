---
# ──────────────────────────────────────────────────────────────────────────────
# ServiceAccount
# ── Required by KubernetesServiceDiscoveryProvider to watch Ingress resources
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: ecp-dev
  labels:
    app.kubernetes.io/name: api-gateway

---
# ──────────────────────────────────────────────────────────────────────────────
# Role (namespace-scoped)
# ── FIX: Downgraded from ClusterRole → Role (least privilege)
# ── Gateway only needs to read Ingresses inside ecp-dev namespace
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-gateway-ingress-reader
  namespace: ecp-dev
  labels:
    app.kubernetes.io/name: api-gateway
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]

---
# ──────────────────────────────────────────────────────────────────────────────
# RoleBinding
# ── FIX: Downgraded from ClusterRoleBinding → RoleBinding
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-gateway-ingress-reader
  namespace: ecp-dev
  labels:
    app.kubernetes.io/name: api-gateway
subjects:
  - kind: ServiceAccount
    name: api-gateway
    namespace: ecp-dev
roleRef:
  kind: Role
  name: api-gateway-ingress-reader
  apiGroup: rbac.authorization.k8s.io

---
# ──────────────────────────────────────────────────────────────────────────────
# Deployment
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecp-dev
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
    version: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/name: api-gateway
        version: dev
    spec:
      serviceAccountName: api-gateway
      containers:
        - name: api-gateway
          image: api-gateway:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            # Namespace where gateway watches for Ingress resources
            - name: Kubernetes__Namespace
              value: "ecp-dev"
            # FIX: was "http://epc-warehouse" (typo)
            # Points to ClusterIP service name — used as fallback base URL
            # YARP uses this when no proxy.gateway/destination-url annotation is set
            - name: Kubernetes__IngressBaseUrl
              value: "http://ecp-warehouse.ecp-dev.svc.cluster.local"
            - name: Gateway__EnableRateLimiting
              value: "false"
            - name: Gateway__DefaultRateLimitPermitLimit
              value: "100"
            - name: Gateway__DefaultRateLimitWindowSeconds
              value: "10"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always

---
# ──────────────────────────────────────────────────────────────────────────────
# Service (ClusterIP)
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecp-dev
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  sessionAffinity: None

---
# ──────────────────────────────────────────────────────────────────────────────
# Service (LoadBalancer) — MetalLB production / minikube tunnel macOS
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-lb
  namespace: ecp-dev
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  sessionAffinity: None

---
# ──────────────────────────────────────────────────────────────────────────────
# Service (NodePort) — Minikube direct access
# ── Access via: http://<minikube-ip>:30081
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-nodeport
  namespace: ecp-dev
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30081
      protocol: TCP
  sessionAffinity: None

---
# ──────────────────────────────────────────────────────────────────────────────
# Ingress
# ── Routes external traffic into api-gateway
# ── No proxy.gateway annotations here — gateway does NOT proxy itself
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: ecp-dev
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

    # ── CORS ──────────────────────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,Authorization,Content-Type,X-Correlation-ID"

    # ── Timeouts ──────────────────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

    # ── Max upload size ───────────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

spec:
  ingressClassName: nginx
  rules:
    # ⚠️ Add to /etc/hosts: 192.168.49.2 api-gateway.dev
    - host: api-gateway.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80