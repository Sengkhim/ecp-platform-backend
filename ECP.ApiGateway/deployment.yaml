---
# ══════════════════════════════════════════════════════════════════════════════
# Namespace
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Namespace
metadata:
  name: ecp-dev
  labels:
    app.kubernetes.io/name: ecp
    environment: development

---
# ══════════════════════════════════════════════════════════════════════════════
# ServiceAccount — Required by KubernetesServiceDiscoveryProvider to watch Ingress resources
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: ecp-dev
  labels:
    app.kubernetes.io/name: api-gateway

---
# ══════════════════════════════════════════════════════════════════════════════
# Role (namespace-scoped) — Least privilege: only read Ingresses in ecp-dev
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-gateway-ingress-reader
  namespace: ecp-dev
  labels:
    app.kubernetes.io/name: api-gateway
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]

---
# ══════════════════════════════════════════════════════════════════════════════
# RoleBinding — Binds the Role to the ServiceAccount
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-gateway-ingress-reader
  namespace: ecp-dev
  labels:
    app.kubernetes.io/name: api-gateway
subjects:
  - kind: ServiceAccount
    name: api-gateway
    namespace: ecp-dev
roleRef:
  kind: Role
  name: api-gateway-ingress-reader
  apiGroup: rbac.authorization.k8s.io

---
# ══════════════════════════════════════════════════════════════════════════════
# ConfigMap — Gateway configuration (can be overridden by environment variables)
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: ecp-dev
  labels:
    app.kubernetes.io/name: api-gateway
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft.AspNetCore": "Warning",
          "Yarp": "Information",
          "ECP.ApiGateway": "Information"
        }
      },
      "AllowedHosts": "*",
      "Kubernetes": {
        "Namespace": "ecp-dev",
        "IngressBaseUrl": "http://ecp-warehouse.ecp-dev.svc.cluster.local"
      },
      "Gateway": {
        "EnableRateLimiting": false,
        "DefaultRateLimitPermitLimit": 100,
        "DefaultRateLimitWindowSeconds": 10
      },
      "HealthChecks": {
        "Enable": true,
        "Path": "/health"
      },
      "Cors": {
        "Enable": true,
        "AllowedOrigins": ["*"],
        "AllowedMethods": ["GET", "POST", "PUT", "DELETE", "OPTIONS"],
        "AllowedHeaders": ["DNT", "X-CustomHeader", "Keep-Alive", "User-Agent", "Authorization", "Content-Type", "X-Correlation-ID"]
      }
    }

---
# ══════════════════════════════════════════════════════════════════════════════
# Deployment
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecp-dev
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
    version: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/name: api-gateway
        version: dev
    spec:
      serviceAccountName: api-gateway
      containers:
        - name: api-gateway
          image: ecp.apigateway:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            # Kubernetes namespace where gateway watches for Ingress resources
            - name: Kubernetes__Namespace
              value: "ecp-dev"
            # Fallback destination URL (used when Ingress has no destination-url annotation)
            - name: Kubernetes__IngressBaseUrl
              value: "http://ecp-warehouse.ecp-dev.svc.cluster.local"
            - name: Gateway__EnableRateLimiting
              value: "false"
            - name: Gateway__DefaultRateLimitPermitLimit
              value: "100"
            - name: Gateway__DefaultRateLimitWindowSeconds
              value: "10"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /app/appsettings.json
              subPath: appsettings.json
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: api-gateway-config
            items:
              - key: appsettings.json
                path: appsettings.json

---
# ══════════════════════════════════════════════════════════════════════════════
# Service (ClusterIP) — Internal cluster communication
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecp-dev
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  sessionAffinity: None

---
# ══════════════════════════════════════════════════════════════════════════════
# Service (LoadBalancer) — MetalLB production / minikube tunnel macOS
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-lb
  namespace: ecp-dev
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  sessionAffinity: None

---
# ══════════════════════════════════════════════════════════════════════════════
# Service (NodePort) — Minikube direct access via http://<minikube-ip>:30081
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-nodeport
  namespace: ecp-dev
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30081
      protocol: TCP
  sessionAffinity: None

---
# ══════════════════════════════════════════════════════════════════════════════
# Ingress — Routes external traffic into api-gateway
# IMPORTANT: This Ingress is for nginx to route TO the gateway, NOT for the gateway to proxy
# It does NOT have proxy.gateway/enabled annotation, so the gateway will ignore it
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: ecp-dev
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
  annotations:
    # ══════════════════════════════════════════════════════════════════════════
    # IMPORTANT: Do NOT add proxy.gateway/enabled: "true" here!
    # This Ingress is for nginx to route external traffic TO the gateway.
    # The gateway should NOT try to proxy this Ingress - it would create a loop.
    # ══════════════════════════════════════════════════════════════════════════
    
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,Authorization,Content-Type,X-Correlation-ID"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    # Add to /etc/hosts: 192.168.49.2 api-gateway.dev
    - host: api-gateway.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80