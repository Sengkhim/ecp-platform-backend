# ═════════════════════════════════════════════════════════════
# ECP API GATEWAY - FIXED SINGLE FILE
# Kubernetes + YARP + NGINX + MetalLB (OrbStack)
# ═════════════════════════════════════════════════════════════

---
# ═════════════════════ Namespace ═════════════════════
apiVersion: v1
kind: Namespace
metadata:
  name: ecp-prod
  labels:
    app.kubernetes.io/name: ecp
    environment: production

---
# ═════════════════════ ServiceAccount ═════════════════════
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: ecp-prod

---
# ═════════════════════ RBAC Role ═════════════════════
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-gateway-ingress-reader
  namespace: ecp-prod
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-gateway-ingress-reader
  namespace: ecp-prod
subjects:
  - kind: ServiceAccount
    name: api-gateway
    namespace: ecp-prod
roleRef:
  kind: Role
  name: api-gateway-ingress-reader
  apiGroup: rbac.authorization.k8s.io

---
# ═════════════════════ ConfigMap ═════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: ecp-prod
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft.AspNetCore": "Warning",
          "Yarp": "Information"
        }
      },
      "AllowedHosts": "*",
      "Gateway": {
        "EnableRateLimiting": true
      }
    }

---
# ═════════════════════ Secret ═════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: ecp-prod
type: Opaque
data:
  JWT_SECRET: c2VjcmV0

---
# ═════════════════════ Deployment ═════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecp-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: api-gateway
      containers:
        - name: api-gateway
          image: devkhim/ecp.apigateway:dev
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20

---
# ═════════════════════ Service (ClusterIP) ═════════════════════
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecp-prod
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080

---
# ═════════════════════ Ingress ═════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: ecp-prod
spec:
  ingressClassName: nginx
  rules:
    - host: api-gateway.ecp.prod
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80

---
# ═════════════════════ METALLB (EXTERNAL ACCESS FIX) ═════════════════════
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: prod-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.139.240-192.168.139.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: prod-advertise
  namespace: metallb-system