# ══════════════════════════════════════════════════════════════════════════════
# ECP API GATEWAY - PRODUCTION READY
# Namespace: ecp-prod
# Environment: Production
# .NET 8 + YARP + Kubernetes Ingress Discovery
# ══════════════════════════════════════════════════════════════════════════════

---
# ══════════════════════════════════════════════════════════════════════════════
# Namespace
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Namespace
metadata:
  name: ecp-prod
  labels:
    app.kubernetes.io/name: ecp
    environment: production

---
# ══════════════════════════════════════════════════════════════════════════════
# ServiceAccount
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: ecp-prod
  labels:
    app.kubernetes.io/name: api-gateway

---
# ══════════════════════════════════════════════════════════════════════════════
# Role
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-gateway-ingress-reader
  namespace: ecp-prod
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]

---
# ══════════════════════════════════════════════════════════════════════════════
# RoleBinding
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-gateway-ingress-reader
  namespace: ecp-prod
subjects:
  - kind: ServiceAccount
    name: api-gateway
    namespace: ecp-prod

roleRef:
  kind: Role
  name: api-gateway-ingress-reader
  apiGroup: rbac.authorization.k8s.io

---
# ══════════════════════════════════════════════════════════════════════════════
# ConfigMap
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: ecp-prod
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft.AspNetCore": "Warning",
          "Yarp": "Information",
          "ECP.ApiGateway": "Information"
        }
      },

      "AllowedHosts": "*",

      "Kubernetes": {
        "Namespace": "ecp-prod",
        "IngressBaseUrl": "http://ecp-warehouse.ecp-prod.svc.cluster.local"
      },

      "Gateway": {
        "EnableRateLimiting": true,
        "DefaultRateLimitPermitLimit": 100,
        "DefaultRateLimitWindowSeconds": 10
      },

      "HealthChecks": {
        "Enable": true,
        "Path": "/health"
      },

      "Cors": {
        "Enable": true,
        "AllowedOrigins": [
          "https://app.epc.com"
        ],
        "AllowedMethods": [
          "GET",
          "POST",
          "PUT",
          "DELETE",
          "OPTIONS"
        ],
        "AllowedHeaders": [
          "Authorization",
          "Content-Type",
          "X-Correlation-ID"
        ]
      }
    }

---
# ══════════════════════════════════════════════════════════════════════════════
# Secret Example
# Replace values with actual base64 values
# echo -n "value" | base64
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: ecp-prod
type: Opaque
data:
  JWT_SECRET: c2VjcmV0
  API_KEY: c2VjcmV0

---
# ══════════════════════════════════════════════════════════════════════════════
# Deployment
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecp-prod
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
    environment: production

spec:
  replicas: 2

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/name: api-gateway
        environment: production

    spec:
      serviceAccountName: api-gateway

      terminationGracePeriodSeconds: 30

      containers:
        - name: api-gateway

          image: devkhim/ecp.apigateway:dev

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"

            - name: ASPNETCORE_URLS
              value: "http://+:8080"

            - name: Kubernetes__Namespace
              value: "ecp-prod"

            - name: Kubernetes__IngressBaseUrl
              value: "http://ecp-warehouse.ecp-prod.svc.cluster.local"

            - name: Gateway__EnableRateLimiting
              value: "true"

            - name: Gateway__DefaultRateLimitPermitLimit
              value: "100"

            - name: Gateway__DefaultRateLimitWindowSeconds
              value: "10"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secret
                  key: JWT_SECRET

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"

            limits:
              cpu: "1000m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080

            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health/live
              port: 8080

            failureThreshold: 30
            periodSeconds: 5

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false

          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true

      restartPolicy: Always

      volumes:
        - name: config
          configMap:
            name: api-gateway-config

---
# ══════════════════════════════════════════════════════════════════════════════
# Service (ClusterIP)
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecp-prod
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway

spec:
  type: ClusterIP

  selector:
    app: api-gateway

  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

---
# ══════════════════════════════════════════════════════════════════════════════
# Horizontal Pod Autoscaler
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: ecp-prod

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway

  minReplicas: 3
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70

---
# ══════════════════════════════════════════════════════════════════════════════
# Pod Disruption Budget
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: ecp-prod

spec:
  minAvailable: 1

  selector:
    matchLabels:
      app: api-gateway

---
